<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Formulario de Contacto</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        .contenedor {
            width: 400px;
            margin: 50px auto;
            background-color: #ffffff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            color: #333;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input, select {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        .materia {
            background-color: #e6e6e6;
        }

        button {
            width: 100%;
            margin-top: 20px;
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #45a049;
        }
    </style>
</head>

<body>

    <div class="contenedor">
        <h2>Formulario de Contacto</h2>

        <form>
            <label for="matricula">Matrícula</label>
            <input type="text" id="matricula" name="matricula" placeholder="Ej. 2103456">

            <label for="nombre">Nombre</label>
            <input type="text" id="nombre" name="nombre" placeholder="Tu nombre completo">

            <label for="materia">Materia</label>
            <select id="materia" name="materia" class="materia">
                <option>Programación Web</option>
                <option>Base de Datos</option>
                <option>Estructura de Datos</option>
                <option>Ingeniería de Software</option>
            </select>

            <button type="submit">Enviar</button>
        </form>
    </div>

</body>
</html>
